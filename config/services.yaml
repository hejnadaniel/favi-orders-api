services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Dto/'
            - '../src/Entity/'
            - '../src/Exception/'
            - '../src/ValueObject/'
            - '../src/Validator/'

    App\Repository\OrderRepositoryInterface: '@App\Repository\DoctrineOrderRepository'
