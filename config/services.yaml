# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            # Entities, value objects and contracts are not services.
            - '../src/Order/Domain/'

    # Domain port -> infrastructure adapter.
    App\Order\Domain\OrderRepository: '@App\Order\Infrastructure\Doctrine\DoctrineOrderRepository'
